included:
  - Kurn
  - KurnTests
  - KurnWatch
  - KurnLiveActivityExtension

opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button

# Warning-level: escalating to error (CI run 32656104597, this branch)
# surfaced 44 real violations — far beyond the VoiceOver pass's scope (Views/,
# KurnWatch/, KurnLiveActivityExtension/) and spread across files the pass
# never touched, with no file/line available from any tool in this session
# (SwiftLint's github-actions-logging reporter emits bare messages here; the
# GitHub annotations API needs authenticated access this session doesn't
# have). Escalating blind risked "fixing" 44 unlocated violations by guesswork,
# so this stays warning — still tracked, not silently regressed — until
# someone with local Xcode/swiftlint or GitHub UI access can attribute them.
accessibility_label_for_image:
  severity: warning
accessibility_trait_for_button:
  severity: warning

excluded:
  - .build
  - .git
  - build_dd
  - Carthage
  - DerivedData
  - Pods

line_length:
  warning: 160
  error: 240
  ignores_comments: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true
  ignores_urls: true

file_length:
  warning: 600
  error: 900

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 120
  error: 180

function_parameter_count:
  warning: 5
  error: 8

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 2
    error: 3
  function_level:
    warning: 3
    error: 5

identifier_name:
  min_length:
    warning: 2
  excluded:
    - a
    - b
    - c
    - g
    - id
    - i
    - n
    - r
    - s
    - t
    - v
    - vm
    - x
    - y

type_name:
  min_length:
    warning: 2
  excluded:
    - E
