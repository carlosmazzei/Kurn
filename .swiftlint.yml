included:
  - Kurn
  - KurnTests
  - KurnWatch
  - KurnLiveActivityExtension
  - Packages/KurnCore/Sources
  - Packages/KurnCore/Tests

opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button

# Error severity. A first escalation attempt (CI run 32656104597) surfaced
# 44 real violations with no file/line available from any tool in that
# session; a follow-up CI step (see .github/workflows/swift.yml, "Generate
# lint report") uploads a `swiftlint-report.json` (--reporter json) with
# exact file/line for exactly this situation. All 44 from that report are
# now fixed (each Image() got either an .accessibilityLabel or an explicit
# .accessibilityHidden(true); the two accessibility_trait_for_button sites
# were tap-to-dismiss-keyboard gestures on a whole form/scroll view, not
# buttons, so those use `// swiftlint:disable:next` with a comment instead
# of a misleading `.isButton` trait).
accessibility_label_for_image:
  severity: error
accessibility_trait_for_button:
  severity: error

excluded:
  - .build
  - .git
  - build_dd
  - Carthage
  - DerivedData
  - Pods

line_length:
  warning: 160
  error: 240
  ignores_comments: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true
  ignores_urls: true

file_length:
  warning: 600
  error: 900

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 120
  error: 180

function_parameter_count:
  warning: 5
  error: 8

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 2
    error: 3
  function_level:
    warning: 3
    error: 5

identifier_name:
  min_length:
    warning: 2
  excluded:
    - a
    - b
    - c
    - g
    - id
    - i
    - n
    - r
    - s
    - t
    - v
    - vm
    - x
    - y

type_name:
  min_length:
    warning: 2
  excluded:
    - E
