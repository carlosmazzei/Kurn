<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kurn Marketing Screenshot</title>
<style>
  /* Palette is the app's own (Kurn/Infrastructure/Theme.swift): the brand
     accent is the record red #FF3B30, the dark background #0A0A0F, and the
     secondary warm tone the app's warning orange #FF9F0A. Keep these in sync
     with Theme.swift rather than inventing marketing colors. */
  :root {
    --accent: #ff3b30;
    --accent-2: #ff9f0a;
    --bg-1: #0a0a0f;
    --bg-2: #1a0e12;
    --ink: #f7f5f6;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg-1);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .canvas {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    background:
      radial-gradient(circle at 18% 10%, rgba(255, 59, 48, 0.38), transparent 44%),
      radial-gradient(circle at 88% 80%, rgba(255, 159, 10, 0.22), transparent 46%),
      linear-gradient(160deg, var(--bg-2) 0%, var(--bg-1) 55%, #000 100%);
  }

  /* Subtle grain-free vignette so the far edges never look flat. It sits
     BELOW the floating card (z-index 5) on purpose: stacked above it, the
     vignette's darkest corner lands exactly on the bottom-left card and
     crushes its contrast. */
  .canvas::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, transparent 58%, rgba(0, 0, 0, 0.5) 100%);
    pointer-events: none;
    z-index: 4;
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(10vw);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  .glow.top {
    width: 62vw;
    height: 62vw;
    top: -22vw;
    left: -12vw;
    background: var(--accent);
  }

  .glow.bottom {
    width: 52vw;
    height: 52vw;
    bottom: -16vw;
    right: -12vw;
    background: var(--accent-2);
  }

  .badge {
    margin-top: 7vh;
    padding: 1.4vh 3.4vw;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    color: #05060a;
    font-weight: 700;
    font-size: 2.5vw;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    box-shadow: 0 1.6vh 3.2vh rgba(255, 59, 48, 0.4);
    z-index: 3;
  }

  .copy {
    z-index: 3;
    text-align: center;
    padding: 0 8vw;
    margin-top: 3.2vh;
  }

  .copy h1 {
    color: var(--ink);
    font-size: 6.4vw;
    line-height: 1.14;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .copy h1 .highlight {
    background: linear-gradient(120deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .copy p {
    margin-top: 2.2vh;
    color: rgba(240, 236, 238, 0.76);
    font-size: 2.8vw;
    font-weight: 500;
    line-height: 1.45;
  }

  .stage {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    margin-top: 4vh;
    z-index: 1;
  }

  .device {
    position: relative;
    /* Sized to leave clearance under the device: at 68vh it ended ~5% from
       the canvas bottom, which clipped the drop shadow and read as a crop. */
    height: 63vh;
    max-width: 84vw;
    aspect-ratio: {{FRAME_ASPECT_RATIO}};
    filter: drop-shadow(-2vw 4vh 5vh rgba(0, 0, 0, 0.55)) drop-shadow(0 2vh 4vh rgba(255, 59, 48, 0.18));
  }

  /* Pinned to the frame's measured screen cutout and clipped to it, so the
     capture can never overhang the bezel. The rounded corners matter: these
     frames' cutouts are square, and their corners sit outside the device's
     rounded silhouette - a square-cornered capture pokes out past the bezel
     as four bright right angles. Radius is given as width% / height% so both
     resolve to the same circular radius in pixels. */
  .device .screen {
    position: absolute;
    left: {{SCREENSHOT_LEFT_PCT}}%;
    top: {{SCREENSHOT_TOP_PCT}}%;
    width: {{SCREENSHOT_WIDTH_PCT}}%;
    height: {{SCREENSHOT_HEIGHT_PCT}}%;
    border-radius: {{SCREEN_RADIUS_X_PCT}}% / {{SCREEN_RADIUS_Y_PCT}}%;
    overflow: hidden;
    z-index: 1;
  }

  .device .screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .device .frame-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  /* The card floats over whatever is behind it - often the bright white app
     screen - so its base is a near-opaque dark fill rather than a mostly
     transparent one. A translucent card reads as washed-out grey over light
     UI and disappears into the vignette over dark. The blur stays for the
     glass feel; the opacity is what makes the text legible. z-index 5 keeps
     it above the vignette (4). */
  .glass-card {
    position: absolute;
    left: 5vw;
    bottom: 7vh;
    width: 48vw;
    padding: 2.6vh 2.4vw;
    border-radius: 2.2vw;
    background: rgba(14, 12, 16, 0.82);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 3vh 5vh rgba(0, 0, 0, 0.55);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 1.8vw;
  }

  .glass-card .icon {
    width: 6.6vw;
    height: 6.6vw;
    border-radius: 1.6vw;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.2vw;
    color: #0a0a0f;
    flex-shrink: 0;
  }

  .glass-card .text .stat {
    color: #fff;
    font-weight: 800;
    font-size: 2.6vw;
    line-height: 1.22;
  }

  .glass-card .text .label {
    color: rgba(255, 255, 255, 0.78);
    font-size: 2vw;
    font-weight: 500;
    margin-top: 0.5vh;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow top"></div>
    <div class="glow bottom"></div>

    <div class="badge">{{BADGE}}</div>

    <div class="copy">
      <h1>{{TITLE}} <span class="highlight">{{TITLE_HIGHLIGHT}}</span></h1>
      <p>{{SUBTITLE}}</p>
    </div>

    <div class="stage">
      <div class="device">
        <div class="screen"><img src="{{SCREENSHOT_SRC}}" alt="" /></div>
        <img class="frame-overlay" src="{{FRAME_SRC}}" alt="" />
      </div>

      <div class="glass-card">
        <div class="icon">{{CARD_ICON}}</div>
        <div class="text">
          <div class="stat">{{CARD_STAT}}</div>
          <div class="label">{{CARD_LABEL}}</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
