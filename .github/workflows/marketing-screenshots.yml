name: Marketing Screenshots

# Renders sophisticated App Store / marketing screenshots (3D device mockup,
# dark gradient background, glassmorphism card) from the raw captures that
# `bundle exec fastlane screenshots` (fastlane/Fastfile, fastlane/Snapfile)
# produces. Two jobs, split by what each needs:
#
#   capture-ui      (macOS)  - runs the UI tests / Fastlane Snapshot and
#                              uploads the raw PNGs as a build artifact.
#   render-marketing (Linux) - downloads that artifact, renders the final
#                              marketing PNGs with Playwright, and uploads
#                              them as a separate artifact.
#
# Rendering never needs Xcode, so it runs on ubuntu-latest to save macOS CI
# minutes. This is independent of .github/workflows/screenshots.yml, which
# captures the same raw screenshots for a literal App Store Connect upload
# (fastlane's `store_assets` lane) - this workflow is for framed marketing
# assets (website, social, press kit), not the App Store Connect gallery.

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-ui:
    name: Capture raw screenshots (Fastlane Snapshot)
    runs-on: macos-26
    # Mirrors the timeout on screenshots.yml's equivalent job - a stuck UI
    # test has no other bound.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Prepare simulator runtimes
        run: |
          sudo xcodebuild -runFirstLaunch
          if ! xcrun simctl list runtimes available | grep -q "iOS"; then
            xcodebuild -downloadPlatform iOS
          fi

      - name: Generate raw screenshots
        run: bundle exec fastlane screenshots

      - name: Upload raw screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-raw
          path: fastlane/screenshots
          if-no-files-found: error
          retention-days: 14

  render-marketing:
    name: Render marketing screenshots (Playwright)
    needs: capture-ui
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # actions/download-artifact@v4 restores the artifact's directory
      # structure directly (screenshots-raw/<locale>/<device>-<name>.png) -
      # no manual unzip step needed.
      - name: Download raw screenshots artifact
        uses: actions/download-artifact@v4
        with:
          name: screenshots-raw
          path: raw-screenshots

      - name: Install Node dependencies
        working-directory: scripts/screenshots
        run: npm install

      - name: Install Playwright Chromium
        working-directory: scripts/screenshots
        run: npx playwright install --with-deps chromium

      - name: Render marketing screenshots
        working-directory: scripts/screenshots
        run: |
          node render.js \
            --input-dir "$GITHUB_WORKSPACE/raw-screenshots" \
            --output-dir "$GITHUB_WORKSPACE/screenshots-framed"

      - name: Upload marketing screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-framed
          path: screenshots-framed
          if-no-files-found: error
          retention-days: 14
