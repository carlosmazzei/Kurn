name: iOS CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

jobs:
  # Fast, no-simulator signal: SwiftLint, the two config-file validators, and
  # localization key-set parity. None of this needs a booted simulator, so it
  # used to pay for one (inside the old single `build-and-test` job) purely
  # to sit ahead of the build step — splitting it out (H10 PR 24, "split pure/
  # unit, simulator integration, and UI/accessibility signals") reports a
  # lint/config failure in the time SwiftLint itself takes, not after a
  # multi-minute simulator-runtime download.
  lint-and-validate:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi

      - name: Lint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

      # The github-actions-logging reporter above doesn't include file/line in
      # its console output, and SwiftLint lints in parallel, so "Linting 'X'"
      # progress lines and violation reports interleave in whatever order
      # workers finish — adjacency in the log does NOT indicate which file a
      # violation belongs to. This step re-lints (read-only, `|| true` so it
      # never itself fails the job) with the `json` reporter, which does
      # carry exact file/line, and uploads it so violations can be attributed
      # without a local Xcode/swiftlint install.
      - name: Generate lint report (file/line diagnostics)
        if: always()
        run: swiftlint lint --config .swiftlint.yml --reporter json > swiftlint-report.json || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiftlint-report
          path: swiftlint-report.json
          retention-days: 14

      # SwiftLint does not read .strings, and Xcode compiles them into a binary
      # plist that silently collapses duplicate keys — so a duplicate is
      # invisible to both the linter and the test suite. Check the sources.
      - name: Check localization files
        run: |
          keys() { grep -o '^"[^"]*"' "$1" | sort; }
          reference=Kurn/Resources/en.lproj/Localizable.strings
          status=0
          for f in Kurn/Resources/*.lproj/Localizable.strings; do
            dupes=$(keys "$f" | uniq -d)
            if [ -n "$dupes" ]; then
              echo "::error file=$f::duplicate keys: $(echo $dupes | tr '\n' ' ')"
              status=1
            fi
            if ! diff -q <(keys "$reference" | uniq) <(keys "$f" | uniq) >/dev/null; then
              echo "::error file=$f::key set differs from en.lproj"
              diff <(keys "$reference" | uniq) <(keys "$f" | uniq) || true
              status=1
            fi
          done
          exit $status

      - name: Validate App Store metadata
        run: |
          python3 Tools/validate_store_metadata.py
          ruby -r ./fastlane/accessibility_labels -e 'AccessibilityLabels.load("fastlane/accessibility.json")'

  # H10 PR 24: allow-listed checks for a production fatalError/
  # preconditionFailure, a silently-dropped ModelContext save, an ad hoc
  # URLSession bypassing the app's sanctioned transport seams, and a raw
  # error description logged at `.public`. Pure text scanning over Swift
  # sources, so it needs neither Xcode nor a simulator — reports in seconds,
  # in parallel with everything else. See Tools/check_static_policy.py's own
  # header for what is and is not covered and why.
  static-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run static policy checks
        run: python3 Tools/check_static_policy.py

  # Simulator-integration signal: KurnTests (Swift Testing unit/integration
  # suite) plus KurnSwiftDataTests (split into its own test target for
  # process isolation — see the scheme's own comment). Reports separately
  # from ui-accessibility-tests below (H10 PR 24, item 3) so a flaky UI-test
  # launch can never obscure a deterministic data-integrity failure in this
  # suite, or vice versa.
  unit-tests:
    runs-on: macos-26

    env:
      XCODE_PROJECT: Kurn.xcodeproj
      XCODE_SCHEME: Kurn
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare simulator runtimes
        run: |
          sudo xcodebuild -runFirstLaunch

          if ! xcrun simctl list runtimes available | grep -q "iOS"; then
            xcodebuild -downloadPlatform iOS
          fi

          if ! xcrun simctl list runtimes available | grep -q "watchOS"; then
            xcodebuild -downloadPlatform watchOS
          fi

      # Caches the resolved/checked-out SPM packages (FluidAudio, KurnCore,
      # and the two large ones: the whisper.cpp binary XCFramework and
      # sherpa-onnx), not compiled build products. `xcodebuild clean` only
      # wipes `<DerivedDataPath>/Build/`, never `SourcePackages`, so this is
      # safe alongside `clean test` below — it cannot serve a stale compiled
      # artifact, only avoid re-fetching unchanged package sources. Keyed on
      # the files that actually pin what gets resolved: project.pbxproj's
      # `XCRemoteSwiftPackageReference` entries and WhisperCpp's manifest
      # (which pins the XCFramework's download URL/checksum). Shared (same
      # key) with ui-accessibility-tests below, since both resolve the same
      # packages from the same scheme.
      - name: Cache resolved SPM packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Kurn.xcodeproj/project.pbxproj', 'Packages/WhisperCpp/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build and test
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -only-testing:KurnTests \
            -only-testing:KurnSwiftDataTests \
            clean test

      # H10 PR 24, item 4: retain enough evidence to diagnose one run without
      # needing to reproduce it locally. The .xcresult bundle carries the
      # full test log, timings, and any attachments a failing test captured.
      - name: Collect simulator/system logs on failure
        if: failure()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/failure-diagnostics"
          booted_udid=$(xcrun simctl list devices booted -j | python3 -c "import json, sys; data = json.load(sys.stdin); devices = [d for group in data['devices'].values() for d in group if d.get('state') == 'Booted']; print(devices[0]['udid'] if devices else '')")
          if [ -n "$booted_udid" ]; then
            xcrun simctl spawn "$booted_udid" log collect \
              --output "$RUNNER_TEMP/failure-diagnostics/simulator.logarchive" || true
          fi
          cp -R ~/Library/Logs/DiagnosticReports "$RUNNER_TEMP/failure-diagnostics/" 2>/dev/null || true
          exit 0

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-failure-diagnostics
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/failure-diagnostics
          retention-days: 14

  # UI/accessibility signal: KurnUITests, i.e. AccessibilityAuditUITests
  # (ScreenshotUITests stays excluded here exactly as it is in the scheme —
  # it needs fastlane's snapshot setup and runs via `fastlane screenshots`
  # instead). Split from unit-tests above for the same reason: a simulator
  # launch/UI flake and a data-integrity regression should never share one
  # red check.
  ui-accessibility-tests:
    runs-on: macos-26

    env:
      XCODE_PROJECT: Kurn.xcodeproj
      XCODE_SCHEME: Kurn
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare simulator runtimes
        run: |
          sudo xcodebuild -runFirstLaunch

          if ! xcrun simctl list runtimes available | grep -q "iOS"; then
            xcodebuild -downloadPlatform iOS
          fi

          if ! xcrun simctl list runtimes available | grep -q "watchOS"; then
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Cache resolved SPM packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Kurn.xcodeproj/project.pbxproj', 'Packages/WhisperCpp/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build and test
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -only-testing:KurnUITests \
            -skip-testing:KurnUITests/ScreenshotUITests \
            clean test

      # Failed UI/accessibility-audit tests attach their own screenshots to
      # the .xcresult bundle automatically (XCTest's failure-screenshot
      # capture); uploading the bundle carries them without a separate
      # extraction step.
      - name: Collect simulator/system logs on failure
        if: failure()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/failure-diagnostics"
          booted_udid=$(xcrun simctl list devices booted -j | python3 -c "import json, sys; data = json.load(sys.stdin); devices = [d for group in data['devices'].values() for d in group if d.get('state') == 'Booted']; print(devices[0]['udid'] if devices else '')")
          if [ -n "$booted_udid" ]; then
            xcrun simctl spawn "$booted_udid" log collect \
              --output "$RUNNER_TEMP/failure-diagnostics/simulator.logarchive" || true
          fi
          cp -R ~/Library/Logs/DiagnosticReports "$RUNNER_TEMP/failure-diagnostics/" 2>/dev/null || true
          exit 0

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-accessibility-tests-failure-diagnostics
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/failure-diagnostics
          retention-days: 14

  # Fast, Xcode-free signal for the KurnCore package (see docs/roadmap.md,
  # "The change that isn't a feature: SPM extraction"): runs in seconds on
  # Linux, well before the macOS jobs' simulator boot finishes, and proves
  # the package's pure logic actually passes its tests rather than just
  # compiling under Xcode. Deliberately no `needs:` on the other jobs so all
  # of them run in parallel.
  kurncore-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: swift test
        working-directory: Packages/KurnCore
        run: swift test

  release:
    needs: [lint-and-validate, static-policy, unit-tests, ui-accessibility-tests, kurncore-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Publish GitHub release
        run: bundle exec fastlane github_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  beta:
    needs: [lint-and-validate, static-policy, unit-tests, ui-accessibility-tests, kurncore-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    # Gates the actual TestFlight upload behind the `release` GitHub
    # Environment (required reviewers, if configured) so a stray tag push
    # still waits for manual approval before anything is signed and
    # uploaded to App Store Connect.
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build and upload to TestFlight
        run: bundle exec fastlane beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}

  store-assets:
    needs: [lint-and-validate, static-policy, unit-tests, ui-accessibility-tests, kurncore-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/screenshots.yml
    with:
      upload: true
    secrets: inherit

  submit:
    needs: [beta, store-assets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: app-store-submission
      cancel-in-progress: false
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Submit processed build for App Review
        run: bundle exec fastlane submit_review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
