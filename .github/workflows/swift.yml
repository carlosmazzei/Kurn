name: iOS CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  # Fast, no-simulator signal: SwiftLint, the two config-file validators, and
  # localization key-set parity. None of this needs a booted simulator, so it
  # used to pay for one (inside the old single `build-and-test` job) purely
  # to sit ahead of the build step — splitting it out (H10 PR 24, "split pure/
  # unit, simulator integration, and UI/accessibility signals") reports a
  # lint/config failure in the time SwiftLint itself takes, not after a
  # multi-minute simulator-runtime download.
  lint-and-validate:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi

      - name: Lint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

      # The github-actions-logging reporter above doesn't include file/line in
      # its console output, and SwiftLint lints in parallel, so "Linting 'X'"
      # progress lines and violation reports interleave in whatever order
      # workers finish — adjacency in the log does NOT indicate which file a
      # violation belongs to. This step re-lints (read-only, `|| true` so it
      # never itself fails the job) with the `json` reporter, which does
      # carry exact file/line, and uploads it so violations can be attributed
      # without a local Xcode/swiftlint install.
      - name: Generate lint report (file/line diagnostics)
        if: always()
        run: swiftlint lint --config .swiftlint.yml --reporter json > swiftlint-report.json || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiftlint-report
          path: swiftlint-report.json
          retention-days: 14

      # SwiftLint does not read .strings, and Xcode compiles them into a binary
      # plist that silently collapses duplicate keys — so a duplicate is
      # invisible to both the linter and the test suite. Check the sources.
      - name: Check localization files
        run: |
          keys() { grep -o '^"[^"]*"' "$1" | sort; }
          reference=Kurn/Resources/en.lproj/Localizable.strings
          status=0
          for f in Kurn/Resources/*.lproj/Localizable.strings; do
            dupes=$(keys "$f" | uniq -d)
            if [ -n "$dupes" ]; then
              echo "::error file=$f::duplicate keys: $(echo $dupes | tr '\n' ' ')"
              status=1
            fi
            if ! diff -q <(keys "$reference" | uniq) <(keys "$f" | uniq) >/dev/null; then
              echo "::error file=$f::key set differs from en.lproj"
              diff <(keys "$reference" | uniq) <(keys "$f" | uniq) || true
              status=1
            fi
          done
          exit $status

      - name: Validate App Store metadata
        run: |
          python3 Tools/validate_store_metadata.py
          ruby -r ./fastlane/accessibility_labels -e 'AccessibilityLabels.load("fastlane/accessibility.json")'

  # H10 PR 24: allow-listed checks for a production fatalError/
  # preconditionFailure, a silently-dropped ModelContext save, an ad hoc
  # URLSession bypassing the app's sanctioned transport seams, and a raw
  # error description logged at `.public`. Pure text scanning over Swift
  # sources, so it needs neither Xcode nor a simulator — reports in seconds,
  # in parallel with everything else. See Tools/check_static_policy.py's own
  # header for what is and is not covered and why.
  static-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run static policy checks
        run: python3 Tools/check_static_policy.py

  # Simulator-integration signal: KurnTests (Swift Testing unit/integration
  # suite) plus KurnSwiftDataTests (split into its own test target for
  # process isolation — see the scheme's own comment). Reports separately
  # from ui-accessibility-tests below (H10 PR 24, item 3) so a flaky UI-test
  # launch can never obscure a deterministic data-integrity failure in this
  # suite, or vice versa.
  unit-tests:
    runs-on: macos-26

    env:
      XCODE_PROJECT: Kurn.xcodeproj
      XCODE_SCHEME: Kurn
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: ./.github/actions/prepare-simulator

      # Shared (same key) with ui-accessibility-tests below, since both
      # resolve the same packages from the same scheme.
      - uses: ./.github/actions/cache-spm-packages

      - name: Build and test
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -enableCodeCoverage YES \
            -only-testing:KurnTests \
            -only-testing:KurnSwiftDataTests \
            clean test

      - name: Collect failure diagnostics
        if: failure()
        uses: ./.github/actions/collect-failure-diagnostics
        with:
          artifact-name: unit-tests-failure-diagnostics

      - name: Export and upload coverage
        if: always()
        uses: ./.github/actions/upload-xcode-coverage
        with:
          flag: unittests
          output-file: coverage-unit-tests.lcov
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # UI/accessibility signal: KurnUITests, i.e. AccessibilityAuditUITests
  # (ScreenshotUITests stays excluded here exactly as it is in the scheme —
  # it needs fastlane's snapshot setup and runs via `fastlane screenshots`
  # instead). Split from unit-tests above for the same reason: a simulator
  # launch/UI flake and a data-integrity regression should never share one
  # red check.
  #
  # The flow suites under KurnUITests/Flows run here since their flake rate
  # measured 0/5 in reliability-hardening.yml's `ui-flake-rate` lane (per
  # docs/testing-coverage-plan.md, Fase 3). A suite that starts flaking goes
  # back behind a -skip-testing line until it is fixed and re-measured.
  ui-accessibility-tests:
    runs-on: macos-26

    env:
      XCODE_PROJECT: Kurn.xcodeproj
      XCODE_SCHEME: Kurn
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: ./.github/actions/prepare-simulator

      - uses: ./.github/actions/cache-spm-packages

      - name: Build and test
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -enableCodeCoverage YES \
            -only-testing:KurnUITests \
            -skip-testing:KurnUITests/ScreenshotUITests \
            clean test

      # Failed UI/accessibility-audit tests attach their own screenshots to
      # the .xcresult bundle automatically (XCTest's failure-screenshot
      # capture); uploading the bundle carries them without a separate
      # extraction step.
      - name: Collect failure diagnostics
        if: failure()
        uses: ./.github/actions/collect-failure-diagnostics
        with:
          artifact-name: ui-accessibility-tests-failure-diagnostics

      - name: Export and upload coverage
        if: always()
        uses: ./.github/actions/upload-xcode-coverage
        with:
          flag: uitests
          output-file: coverage-ui-tests.lcov
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # Fast, Xcode-free signal for the KurnCore package (see docs/roadmap.md,
  # "The change that isn't a feature: SPM extraction"): runs in seconds on
  # Linux, well before the macOS jobs' simulator boot finishes, and proves
  # the package's pure logic actually passes its tests rather than just
  # compiling under Xcode. Deliberately no `needs:` on the other jobs so all
  # of them run in parallel.
  kurncore-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: swift test
        working-directory: Packages/KurnCore
        run: swift test --enable-code-coverage

      # SwiftPM's coverage output lands as raw LLVM profile data, not a
      # report; `llvm-cov export` needs the exact test binary the profile
      # was recorded against, which SwiftPM doesn't print a path for and
      # whose name depends on the package's own naming — found by search
      # rather than assumed. `continue-on-error` (not `|| true` inside the
      # step, so a real failure here is still visible in the job's UI as a
      # yellow/skipped step) because this is the one piece of this workflow
      # with no macOS/Xcode toolchain available anywhere in this project's
      # authoring environment to verify against a real SwiftPM coverage
      # build.
      - name: Export coverage report
        if: always()
        continue-on-error: true
        working-directory: Packages/KurnCore
        run: |
          profdata=$(find .build -name "default.profdata" -print -quit)
          binary=$(find .build -name "*PackageTests.xctest" -o -name "*PackageTests" | grep -v '\.build/checkouts' | head -n1)
          if [ -z "$profdata" ] || [ -z "$binary" ]; then
            echo "::warning::could not locate coverage profile/binary; skipping Linux coverage export"
            exit 0
          fi
          test_binary="$binary"
          if [ -d "$binary" ]; then
            test_binary=$(find "$binary" -type f -perm -u+x | head -n1)
          fi
          # The Linux runner has no `llvm-cov` on PATH; use the one bundled with
          # the Swift toolchain that produced the profile.
          llvm_cov="$(dirname "$(readlink -f "$(command -v swift)")")/llvm-cov"
          if [ ! -x "$llvm_cov" ]; then
            llvm_cov=$(command -v llvm-cov || true)
          fi
          if [ -z "$llvm_cov" ]; then
            echo "::warning::llvm-cov not found; skipping Linux coverage export"
            exit 0
          fi
          "$llvm_cov" export -format=lcov "$test_binary" -instr-profile "$profdata" \
            -ignore-filename-regex='(/\.build/|/Tests/)' \
            > "$RUNNER_TEMP/kurncore-coverage.lcov"
          echo "exported $(grep -c '^SF:' "$RUNNER_TEMP/kurncore-coverage.lcov") source files"
          {
            echo "### Coverage (kurncore)"
            python3 Tools/coverage_report.py --root "$GITHUB_WORKSPACE" "$RUNNER_TEMP/kurncore-coverage.lcov" \
              || echo "_coverage summary failed; see the lcov artifact_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/kurncore-coverage.lcov
          flags: kurncore
          disable_search: true
          fail_ci_if_error: false

  release:
    needs: [lint-and-validate, static-policy, unit-tests, ui-accessibility-tests, kurncore-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job in this workflow that writes to the repository (creates a
    # GitHub Release). Every other job only needs to read — the workflow-
    # level default above is `contents: read`.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Publish GitHub release
        run: bundle exec fastlane github_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  beta:
    needs: [lint-and-validate, static-policy, unit-tests, ui-accessibility-tests, kurncore-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    # Gates the actual TestFlight upload behind the `release` GitHub
    # Environment (required reviewers, if configured) so a stray tag push
    # still waits for manual approval before anything is signed and
    # uploaded to App Store Connect.
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # H10 PR 25, item 7: a workflow step runs only after the `release`
      # environment's approval is already granted, so this can't appear
      # *before* that decision — GitHub's own approval UI is the only
      # surface that could, and this workflow can't add to it. What this can
      # do is leave a durable, hard-to-miss record on the run itself, for
      # whoever reviews it during or after the fact.
      - name: Record the physical release checklist reminder
        run: |
          {
            echo "## Physical release checklist"
            echo
            echo "Confirm \`docs/release-physical-checklist.md\` was run on a physical device"
            echo "against this build (or the most recent equivalent build) — this run's approval"
            echo "does not verify that on its own."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and upload to TestFlight
        run: bundle exec fastlane beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}

  store-assets:
    needs: [lint-and-validate, static-policy, unit-tests, ui-accessibility-tests, kurncore-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/screenshots.yml
    with:
      upload: true
    secrets: inherit

  submit:
    needs: [beta, store-assets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: app-store-submission
      cancel-in-progress: false
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Same reminder as `beta`'s, repeated here because `submit` is the
      # actual point of no return — the build goes to Apple after this.
      - name: Record the physical release checklist reminder
        run: |
          {
            echo "## Physical release checklist"
            echo
            echo "Confirm \`docs/release-physical-checklist.md\` was run on a physical device"
            echo "against this build before it goes to App Review — this run's approval does"
            echo "not verify that on its own."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit processed build for App Review
        run: bundle exec fastlane submit_review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
