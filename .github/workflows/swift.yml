name: iOS CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-26

    env:
      XCODE_PROJECT: Kurn.xcodeproj
      XCODE_SCHEME: Kurn
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi

      - name: Lint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

      # SwiftLint does not read .strings, and Xcode compiles them into a binary
      # plist that silently collapses duplicate keys — so a duplicate is
      # invisible to both the linter and the test suite. Check the sources.
      - name: Check localization files
        run: |
          keys() { grep -o '^"[^"]*"' "$1" | sort; }
          reference=Kurn/Resources/en.lproj/Localizable.strings
          status=0
          for f in Kurn/Resources/*.lproj/Localizable.strings; do
            dupes=$(keys "$f" | uniq -d)
            if [ -n "$dupes" ]; then
              echo "::error file=$f::duplicate keys: $(echo $dupes | tr '\n' ' ')"
              status=1
            fi
            if ! diff -q <(keys "$reference" | uniq) <(keys "$f" | uniq) >/dev/null; then
              echo "::error file=$f::key set differs from en.lproj"
              diff <(keys "$reference" | uniq) <(keys "$f" | uniq) || true
              status=1
            fi
          done
          exit $status

      - name: Prepare simulator runtimes
        run: |
          sudo xcodebuild -runFirstLaunch

          if ! xcrun simctl list runtimes available | grep -q "iOS"; then
            xcodebuild -downloadPlatform iOS
          fi

          if ! xcrun simctl list runtimes available | grep -q "watchOS"; then
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Build and test
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            clean test

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Publish GitHub release
        run: bundle exec fastlane github_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  beta:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    # Gates the actual TestFlight upload behind the `release` GitHub
    # Environment (required reviewers, if configured) so a stray tag push
    # still waits for manual approval before anything is signed and
    # uploaded to App Store Connect.
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build and upload to TestFlight
        run: bundle exec fastlane beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}

  metadata:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Text-only push to App Store Connect (fastlane/metadata/, all 7
    # locales) — no signing, no binary, so it needs only the ASC API key,
    # not match. Gated behind `release` like `beta`, for the same reason:
    # a stray tag push still waits for approval before anything reaches
    # App Store Connect.
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Push metadata to App Store Connect
        run: bundle exec fastlane metadata
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
