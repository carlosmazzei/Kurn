name: Pipeline evaluation (public datasets)

# Runs the app's actual transcription/diarization pipeline against public
# benchmark audio (English + Portuguese), across the full cleanup x VAD x
# diarization x ASR-engine matrix in `PipelineEvaluationMatrix`, and scores
# WER/DER against each. See Tools/evaluation/public_datasets/README.md.
#
# On demand only -- this is a measurement run, not a merge gate. Dispatch it
# after a change to any pipeline stage (preprocessing, VAD, diarization,
# transcription engines, TranscriptFusion, ...) to see whether it actually
# moved WER/DER, not just whether it compiles.

on:
  workflow_dispatch:
    inputs:
      matrix:
        description: "essential (8 configs, whisper.cpp only, fast) or full (24+ configs)"
        type: choice
        options: [full, essential]
        default: full
      corpora:
        description: "space-separated corpus ids to fetch (blank = every enabled corpus in manifest.json)"
        type: string
        default: ""
      cloud_providers:
        description: "cloud Whisper providers to benchmark (none, openai, groq, both, auto)"
        type: choice
        options: [none, openai, groq, both, auto]
        default: auto
      whispercpp_models:
        description: "whisper.cpp models to sweep (small, base, largeTurbo, all)"
        type: string
        default: "small"
      resume:
        description: "reuse rows already in report.csv and run only the missing cells"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: macos-26
    # 360 is the ceiling for GitHub-hosted runners, and a full sweep needs the
    # headroom: `whispercpp_models: all` takes the on-device matrix to 40
    # configurations, several of them against a model far slower than `small`,
    # over corpora that include AMI's 5-minute clips. Running out of time is
    # not a partial result -- `writeCSV` runs only after every item, so a job
    # killed at the limit produces no CSV and no aggregate table at all.
    timeout-minutes: 360

    env:
      XCODE_PROJECT: Kurn.xcodeproj
      XCODE_SCHEME: Kurn
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17
      DATASET_DIR: ${{ github.workspace }}/.kurn-eval-public
      REPORT_PATH: ${{ github.workspace }}/.kurn-eval-public/report.csv

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare simulator runtimes
        run: |
          sudo xcodebuild -runFirstLaunch
          if ! xcrun simctl list runtimes available | grep -q "iOS"; then
            xcodebuild -downloadPlatform iOS
          fi
          if ! xcrun simctl list runtimes available | grep -q "watchOS"; then
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dataset-fetch dependencies
        run: python3 -m pip install -r Tools/evaluation/public_datasets/requirements.txt

      # ffmpeg for the AMI fetch (clipping each meeting to its first N minutes).
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi

      # Datasets change rarely; keyed on the manifest so an edit invalidates it.
      - name: Cache public datasets
        uses: actions/cache@v6
        with:
          path: ${{ env.DATASET_DIR }}
          key: kurn-eval-public-${{ hashFiles('Tools/evaluation/public_datasets/manifest.json') }}

      - name: Fetch public datasets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # The AMI fetch lists meeting IDs through the GitHub API, which is
          # capped at 60 requests/hour per IP when unauthenticated -- and
          # hosted runners share IPs, so that budget is often already spent
          # and the listing 403s. `contents: read` is enough to read a public
          # repository's contents.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 Tools/evaluation/public_datasets/fetch_all.py \
            --out "$DATASET_DIR" \
            ${{ github.event.inputs.corpora != '' && format('--only {0}', github.event.inputs.corpora) || '' }}

      - name: Build and test
        env:
          # xcodebuild on Xcode 15.3+ only forwards environment variables to the
          # test runner when they are prefixed with TEST_RUNNER_. The prefix is
          # stripped before reaching ProcessInfo.processInfo.environment.
          TEST_RUNNER_KURN_PUBLIC_EVAL_DATA: ${{ env.DATASET_DIR }}
          TEST_RUNNER_KURN_PUBLIC_EVAL_REPORT: ${{ env.REPORT_PATH }}
          TEST_RUNNER_KURN_PUBLIC_EVAL_MATRIX: ${{ github.event.inputs.matrix }}
          TEST_RUNNER_KURN_PUBLIC_EVAL_CLOUD_PROVIDERS: ${{ github.event.inputs.cloud_providers }}
          TEST_RUNNER_KURN_PUBLIC_EVAL_WHISPERCPP_MODELS: ${{ github.event.inputs.whispercpp_models }}
          # The report is written row by row, so a cancelled or timed-out run
          # leaves a usable partial file. `resume: true` picks that file up and
          # runs only what is missing -- provided it survived, which means either
          # the dataset cache restored it or it was placed here from a previous
          # run's artifact. Reusing a row assumes the pipeline has not changed
          # since it was measured; the harness cannot check that yet, which is
          # why this is opt-in.
          TEST_RUNNER_KURN_PUBLIC_EVAL_RESUME: ${{ github.event.inputs.resume == 'true' && '1' || '0' }}
          # Optional and additive -- controlled by `cloud_providers`. A maintainer
          # who wants cloud Whisper (OpenAI/Groq) in the matrix wires these as repo
          # secrets; PipelineEvaluationMatrix only adds those entries when the
          # corresponding key is actually present. See public_datasets/README.md.
          TEST_RUNNER_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TEST_RUNNER_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            test -only-testing:KurnTests/PublicDatasetEvaluationHarnessTests \
            | tee "$RUNNER_TEMP/pipeline-eval.log"

      # Renders the CSV as the Markdown that goes straight into
      # docs/pipeline-evaluation.md, so recording a run is a paste and a
      # commit. The raw log stays available underneath: the harness requires a
      # failure-free run *before* it writes the CSV, so a run with any failure
      # produces no CSV at all and the grep is the only report there is.
      - name: Publish report summary
        if: always()
        run: |
          python3 Tools/evaluation/report_to_markdown.py \
            --csv "$REPORT_PATH" \
            --log "$RUNNER_TEMP/pipeline-eval.log" \
            --commit "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out "$RUNNER_TEMP/pipeline-evaluation.md" || true
          {
            echo "## Pipeline evaluation report"
            echo
            if [ -s "$RUNNER_TEMP/pipeline-evaluation.md" ]; then
              cat "$RUNNER_TEMP/pipeline-evaluation.md"
              echo
              echo "Paste the above into \`docs/pipeline-evaluation.md\` to record this run."
              echo
            fi
            echo "<details><summary>Raw <code>[pipeline-eval]</code> output</summary>"
            echo
            echo '```'
            grep '^\[pipeline-eval\]' "$RUNNER_TEMP/pipeline-eval.log" || echo "(no [pipeline-eval] lines found -- check the build/test log below)"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-eval-report
          path: |
            ${{ env.REPORT_PATH }}
            ${{ runner.temp }}/pipeline-eval.log
            ${{ runner.temp }}/pipeline-evaluation.md
          if-no-files-found: warn
          retention-days: 90
