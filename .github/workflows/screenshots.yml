name: App Store Screenshots

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Also push captured screenshots (+ text metadata) to App Store Connect via `fastlane store_assets`"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 60
    # Only needed for the optional ASC upload step below; capture itself
    # touches no App Store Connect credentials. Gated behind `release` like
    # `beta`/`metadata` in swift.yml, so an upload still waits for approval
    # if the environment requires reviewers.
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Prepare simulator runtimes
        run: |
          sudo xcodebuild -runFirstLaunch
          if ! xcrun simctl list runtimes available | grep -q "iOS"; then
            xcodebuild -downloadPlatform iOS
          fi

      - name: Generate screenshots
        run: bundle exec fastlane screenshots

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: fastlane/screenshots

      - name: Push screenshots + metadata to App Store Connect
        if: ${{ inputs.upload }}
        run: bundle exec fastlane store_assets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
