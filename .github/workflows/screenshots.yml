name: App Store Screenshots

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Also push captured screenshots (+ text metadata) to App Store Connect via `fastlane store_assets`"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-26
    # The `screenshots` lane now does two separate capture_screenshots runs
    # (iPhone/iPad, then the KurnWatchUITests scheme for the Watch) — a
    # second Xcode build plus a Watch simulator boot on top of the ~59 min
    # the iPhone/iPad-only capture already took, so the old 60 min budget
    # left ~0 margin. Widened rather than tuned tightly.
    timeout-minutes: 90
    # No `environment:` here on purpose. This job never touches App Store
    # Connect, and this workflow is dispatched against arbitrary branches
    # (usually `main`) rather than a release tag — putting it behind the
    # `release` environment (whose deployment policy allows only `v*` tags,
    # same as `beta`/`metadata` in swift.yml) made every dispatch fail
    # instantly with no runner assigned, before checkout even ran. The
    # environment gate belongs only on the `upload` job below, which is the
    # one that actually needs the ASC secrets.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Prepare simulator runtimes
        run: |
          sudo xcodebuild -runFirstLaunch
          if ! xcrun simctl list runtimes available | grep -q "iOS"; then
            xcodebuild -downloadPlatform iOS
          fi
          if ! xcrun simctl list runtimes available | grep -q "watchOS"; then
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Generate screenshots
        run: bundle exec fastlane screenshots

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: fastlane/screenshots

  upload:
    needs: screenshots
    if: ${{ inputs.upload }}
    runs-on: ubuntu-latest
    # Gated behind the `release` GitHub Environment (required reviewers, if
    # configured), same as `beta`/`metadata` in swift.yml, so a stray
    # dispatch with `upload: true` still waits for manual approval before
    # anything reaches App Store Connect. Text/screenshot push only — no
    # signing, no binary — so this runs on ubuntu-latest, same as `metadata`.
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Download screenshots artifact
        uses: actions/download-artifact@v8
        with:
          name: screenshots
          path: fastlane/screenshots

      - name: Push screenshots + metadata to App Store Connect
        run: bundle exec fastlane store_assets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
