name: App Store Screenshots

on:
  workflow_call:
    inputs:
      upload:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      upload:
        description: "Push screenshots + metadata to App Store Connect (requires a vX.Y.Z workflow ref)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-upload-ref:
    if: inputs.upload && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Require a release tag for upload
        run: |
          echo "::error::upload requires dispatching this workflow against a vX.Y.Z release tag"
          exit 1

  # One macOS job per UI language. The capture for en-US alone took ~59 min
  # (iPhone + iPad + Watch, with snapshot's retries on top), so the seven
  # languages cannot share one job; parallel jobs also keep the release
  # pipeline's wall-clock time where it was.
  screenshots:
    if: ${{ !inputs.upload || startsWith(github.ref, 'refs/tags/v') }}
    name: screenshots (${{ matrix.language }})
    runs-on: macos-26
    # Widened for fastlane/Snapfile's `number_of_retries(3)`: a snapshot
    # retry re-runs the entire device, so a flaky iPhone session can repeat
    # up to four times (~19 min each observed) before the iPad and Watch
    # passes start.
    timeout-minutes: 150
    # No `environment:` here on purpose. Capture never touches App Store
    # Connect and also supports ad-hoc dispatches on arbitrary branches. The
    # environment gate belongs only on the tag-only `upload` job below, which
    # is the one that needs ASC secrets and changes App Store Connect.
    strategy:
      fail-fast: false
      matrix:
        language: [en-US, pt-BR, es-ES, fr-FR, it, de-DE, zh-Hans]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: ./.github/actions/prepare-simulator

      - name: Generate screenshots
        env:
          SCREENSHOT_LANGUAGE: ${{ matrix.language }}
        run: bundle exec fastlane screenshots "languages:$SCREENSHOT_LANGUAGE"

      # Fail here rather than ship a locale with a hole in it: snapshot can
      # report success after its retries gave up on one device.
      - name: Check every screen was captured
        env:
          SCREENSHOT_LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          dir="fastlane/screenshots/$SCREENSHOT_LANGUAGE"
          for device in "iPhone 17 Pro Max" "iPad Pro 13-inch (M5)"; do
            count=$(find "$dir" -maxdepth 1 -name "$device-*.png" | wc -l | tr -d ' ')
            if [ "$count" -lt 5 ]; then
              echo "::error::$SCREENSHOT_LANGUAGE has $count/5 screenshots for $device"
              exit 1
            fi
          done

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.language }}
          path: fastlane/screenshots/${{ matrix.language }}
          if-no-files-found: error

  # Recombines the per-language captures into the one "screenshots" artifact
  # (screenshots/<locale>/<device>-<screen>.png) that marketing-screenshots.yml
  # and the upload job below have always read.
  collect-screenshots:
    needs: screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Download per-language captures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: screenshots-*
          path: per-language

      - name: Arrange by locale
        run: |
          set -euo pipefail
          mkdir -p screenshots
          for dir in per-language/screenshots-*/; do
            locale="$(basename "$dir")"
            locale="${locale#screenshots-}"
            mkdir -p "screenshots/$locale"
            cp -v "$dir"*.png "screenshots/$locale/"
          done

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: error

  # Renders the App-Store-ready marketing screenshots (real iPhone/iPad
  # device frame, dark gradient, badges) from the raw captures the
  # `screenshots` job just uploaded — see marketing-screenshots.yml. `upload`
  # below pushes this job's iPhone/iPad output instead of the raw captures;
  # only the raw Apple Watch captures (which this pipeline never frames)
  # still come straight from the `screenshots` artifact.
  marketing-screenshots:
    needs: collect-screenshots
    uses: ./.github/workflows/marketing-screenshots.yml

  upload:
    needs: [collect-screenshots, marketing-screenshots]
    if: ${{ inputs.upload && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Gated behind the `release` GitHub Environment (required reviewers, if
    # configured), same as `beta`/`submit` in swift.yml, so every asset upload
    # waits for manual approval before reaching App Store Connect. Text and
    # screenshots only — no signing or binary — so this runs on ubuntu-latest.
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Raw captures (iPhone + iPad + Apple Watch). The iPhone/iPad files
      # here get replaced below by their framed equivalents; the Watch files
      # are what actually end up uploaded, since Watch never gets framed.
      - name: Download raw screenshots artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: fastlane/screenshots

      - name: Download framed screenshots artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots-framed
          path: screenshots-framed

      # Swap in the framed iPhone/iPad images: drop the raw iPhone/iPad
      # captures so `deliver` never sees both a raw and a framed copy of the
      # same screen, then copy the framed replacements in. Both carry the
      # same "<device>-<screenName>.png" naming (render.js keeps fastlane's),
      # so the delete must run before the copy - it does. Apple Watch files
      # are untouched by either glob, since their names start with "Apple
      # Watch", and they are the one device this pipeline never frames.
      #
      # render.js also produces store locales that were never captured
      # (en-GB, es-MX, ...; see marketing-screenshots.yml). Those get the
      # Apple Watch captures of their own language (en-US when none), so
      # each localization's screenshot set is complete for every device.
      - name: Replace raw iPhone/iPad captures with framed versions
        run: |
          set -euo pipefail
          for framed_dir in screenshots-framed/*/; do
            locale="$(basename "$framed_dir")"
            mkdir -p "fastlane/screenshots/$locale"
            if ls "fastlane/screenshots/$locale"/Apple\ Watch*.png >/dev/null 2>&1; then
              continue
            fi
            language="${locale%%-*}"
            source="en-US"
            for captured in fastlane/screenshots/*/; do
              captured="$(basename "$captured")"
              if [ "${captured%%-*}" = "$language" ] && ls "fastlane/screenshots/$captured"/Apple\ Watch*.png >/dev/null 2>&1; then
                source="$captured"
                break
              fi
            done
            find "fastlane/screenshots/$source" -maxdepth 1 -type f -iname "Apple Watch*.png" -exec cp -v {} "fastlane/screenshots/$locale/" \;
          done
          for locale_dir in fastlane/screenshots/*/; do
            locale="$(basename "$locale_dir")"
            find "$locale_dir" -maxdepth 1 -type f \( -iname "iPhone*.png" -o -iname "iPad*.png" \) -print -delete
            framed_dir="screenshots-framed/$locale"
            if [ -d "$framed_dir" ]; then
              cp -v "$framed_dir"/*.png "$locale_dir"
            else
              echo "::warning::No framed screenshots found for locale \"$locale\" in screenshots-framed/ - iPhone/iPad screenshots for that locale will be missing from this upload."
            fi
          done

      - name: Push screenshots + metadata to App Store Connect
        run: bundle exec fastlane store_assets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
