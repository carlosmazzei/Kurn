name: App Store Screenshots

on:
  workflow_call:
    inputs:
      upload:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      upload:
        description: "Push screenshots + metadata to App Store Connect (requires a vX.Y.Z workflow ref)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-upload-ref:
    if: inputs.upload && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Require a release tag for upload
        run: |
          echo "::error::upload requires dispatching this workflow against a vX.Y.Z release tag"
          exit 1

  screenshots:
    if: ${{ !inputs.upload || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    # The `screenshots` lane now does two separate capture_screenshots runs
    # (iPhone/iPad, then the KurnWatchUITests scheme for the Watch) — a
    # second Xcode build plus a Watch simulator boot on top of the ~59 min
    # the iPhone/iPad-only capture already took, so the old 60 min budget
    # left ~0 margin. Widened rather than tuned tightly.
    timeout-minutes: 90
    # No `environment:` here on purpose. Capture never touches App Store
    # Connect and also supports ad-hoc dispatches on arbitrary branches. The
    # environment gate belongs only on the tag-only `upload` job below, which
    # is the one that needs ASC secrets and changes App Store Connect.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Prepare simulator runtimes
        run: |
          sudo xcodebuild -runFirstLaunch
          if ! xcrun simctl list runtimes available | grep -q "iOS"; then
            xcodebuild -downloadPlatform iOS
          fi
          if ! xcrun simctl list runtimes available | grep -q "watchOS"; then
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Generate screenshots
        run: bundle exec fastlane screenshots

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: fastlane/screenshots

  # Renders framed marketing screenshots (3D mockup, dark gradient, badges)
  # from the raw captures the `screenshots` job just uploaded — see
  # marketing-screenshots.yml. Runs whenever `screenshots` runs, independent
  # of the tag-gated `upload` job below: marketing assets (website, social,
  # press kit) are a different deliverable from the literal App Store
  # Connect screenshots `upload` pushes.
  marketing-screenshots:
    needs: screenshots
    uses: ./.github/workflows/marketing-screenshots.yml

  upload:
    needs: screenshots
    if: ${{ inputs.upload && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Gated behind the `release` GitHub Environment (required reviewers, if
    # configured), same as `beta`/`submit` in swift.yml, so every asset upload
    # waits for manual approval before reaching App Store Connect. Text and
    # screenshots only — no signing or binary — so this runs on ubuntu-latest.
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Download screenshots artifact
        uses: actions/download-artifact@v8
        with:
          name: screenshots
          path: fastlane/screenshots

      - name: Push screenshots + metadata to App Store Connect
        run: bundle exec fastlane store_assets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
